<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular RAG AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.4s, color 0.4s; }

        /* Mesh Gradients */
        .bg-mesh {
            background-color: #f8fafc;
            background-image:
                    radial-gradient(at 0% 0%, #ffffff 0, transparent 50%),
                    radial-gradient(at 50% 0%, rgba(224, 231, 255, 0.7) 0, transparent 50%),
                    radial-gradient(at 100% 0%, rgba(252, 231, 243, 0.6) 0, transparent 50%);
            background-attachment: fixed;
        }

        .dark .bg-mesh {
            background-color: #0f172a;
            background-image:
                    radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                    radial-gradient(at 50% 0%, hsla(225,39%,30%,0.4) 0, transparent 50%),
                    radial-gradient(at 100% 0%, hsla(339,49%,30%,0.3) 0, transparent 50%);
        }

        /* Glassmorphism */
        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Custom Scrollbar */
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 10px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
        .dark .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Animatii fluide */
        @keyframes messageSlide {
            0% { opacity: 0; transform: translateY(15px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-animate { animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .dots-loader { display: flex; gap: 4px; align-items: center; justify-content: center; height: 24px; }
        .dots-loader div { width: 6px; height: 6px; background: #818cf8; border-radius: 50%; animation: pulse 1.2s infinite ease-in-out both; }
        .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader div:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-mesh h-screen flex justify-center items-center text-slate-800 dark:text-slate-200 overflow-hidden selection:bg-indigo-500/30">

<div class="w-full max-w-5xl h-[92vh] glass bg-white/60 dark:bg-white/[0.03] rounded-3xl flex flex-col border border-slate-200 dark:border-white/5 shadow-2xl relative z-10 m-4 overflow-hidden transition-colors duration-300">

    <header class="p-6 flex justify-between items-center border-b border-slate-200 dark:border-white/5 bg-white/40 dark:bg-white/[0.01] transition-colors duration-300">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-layer-group text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-semibold text-slate-800 dark:text-white tracking-tight transition-colors">Nexus RAG</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium tracking-wide uppercase mt-0.5">Inteligență Artificială Tabulară</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-slate-100 dark:bg-black/20 p-1.5 rounded-xl border border-slate-200 dark:border-white/5 transition-all">
                <label class="cursor-pointer px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-file-csv text-indigo-500 dark:text-indigo-400"></i>
                    <span id="fileNameDisplay">Alege CSV</span>
                    <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="updateFileName(this)">
                </label>
                <div class="w-px h-6 bg-slate-300 dark:bg-white/10"></div>
                <button onclick="uploadFile()" id="uploadBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-md flex items-center gap-2">
                    Indexează
                </button>
            </div>

            <div class="relative flex items-center bg-slate-200/50 dark:bg-black/30 border border-slate-300/50 dark:border-white/10 rounded-full p-1 cursor-pointer transition-colors" onclick="toggleTheme()" title="Schimbă tema">
                <div class="absolute left-1 w-8 h-8 bg-white dark:bg-slate-700 rounded-full shadow-sm transition-transform duration-300 ease-in-out transform dark:translate-x-full"></div>

                <div class="relative z-10 w-8 h-8 flex items-center justify-center text-amber-500 dark:text-slate-500 transition-colors duration-300">
                    <i class="fa-solid fa-sun text-[13px]"></i>
                </div>
                <div class="relative z-10 w-8 h-8 flex items-center justify-center text-slate-400 dark:text-indigo-400 transition-colors duration-300">
                    <i class="fa-solid fa-moon text-[13px]"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="statusToast" class="absolute top-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-sm font-medium opacity-0 transition-all duration-500 z-50 pointer-events-none transform -translate-y-4 shadow-xl"></div>

    <div id="chatBox" class="chat-scroll flex-1 overflow-y-auto p-8 space-y-6 scroll-smooth">
        <div class="flex gap-4 msg-animate">
            <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-500/20 border border-indigo-200 dark:border-indigo-500/30 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-robot text-indigo-600 dark:text-indigo-400"></i>
            </div>
            <div class="glass bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 p-5 rounded-2xl rounded-tl-sm max-w-[75%] text-slate-700 dark:text-slate-300 leading-relaxed shadow-sm transition-colors duration-300">
                <p>Salut! Sunt asistentul tău RAG. Încarcă un set de date în format CSV sus în dreapta și întreabă-mă orice.</p>
            </div>
        </div>
    </div>

    <div class="p-6 bg-white/50 dark:bg-black/10 border-t border-slate-200 dark:border-white/5 transition-colors duration-300">
        <div class="relative max-w-4xl mx-auto flex items-end gap-3">
            <div class="relative flex-1 bg-white dark:bg-black/20 border border-slate-300 dark:border-white/10 rounded-2xl focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 dark:focus-within:ring-0 dark:focus-within:border-indigo-500/50 transition-all shadow-sm">
                    <textarea id="questionInput"
                              class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 rounded-2xl px-6 py-4 max-h-32 focus:outline-none resize-none overflow-hidden chat-scroll"
                              placeholder="Pune o întrebare despre datele tale..."
                              rows="1"
                              oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'"
                              onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); askAI(); }"></textarea>
            </div>

            <button onclick="askAI()" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white w-14 h-14 rounded-2xl flex items-center justify-center transition-all shadow-lg shrink-0 group">
                <i class="fa-solid fa-paper-plane transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // --- Sistemul Imbunatatit pentru Tema Dark/Light ---
    function toggleTheme() {
        const htmlElement = document.documentElement;
        htmlElement.classList.toggle('dark');

        if (htmlElement.classList.contains('dark')) {
            localStorage.setItem('theme', 'dark');
        } else {
            localStorage.setItem('theme', 'light');
        }
    }

    if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
    // ---------------------------------------

    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files.length > 0) {
            let name = input.files[0].name;
            display.innerText = name.length > 15 ? name.substring(0, 15) + '...' : name;
            display.classList.add('text-indigo-600', 'dark:text-indigo-300');
        }
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('statusToast');
        toast.innerText = message;
        toast.className = `absolute top-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-sm font-medium z-50 pointer-events-none transform shadow-2xl transition-all duration-500 ${isError ? 'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-200 border border-red-200 dark:border-red-500/30' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-500/30'}`;

        requestAnimationFrame(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
        });

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, -16px)';
        }, 4000);
    }

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');

        if (fileInput.files.length === 0) {
            showToast("Selectează un fișier CSV!", true);
            return;
        }

        uploadBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        uploadBtn.disabled = true;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch('/api/upload', { method: 'POST', body: formData });
            const text = await response.text();
            showToast("Datele au fost indexate și vectorizate perfect.");
            addMessageToChat('AI', `Am citit și indexat fișierul **${fileInput.files[0].name}**. Contextul vectorial este pregătit. Ce vrei să afli?`);
        } catch (error) {
            showToast("Eroare la procesarea fișierului.", true);
        } finally {
            uploadBtn.innerHTML = 'Indexează';
            uploadBtn.disabled = false;
        }
    }

    async function askAI() {
        const inputField = document.getElementById('questionInput');
        let question = inputField.value.trim();
        const sendBtn = document.getElementById('sendBtn');

        if (!question) return;

        inputField.style.height = '';
        inputField.value = '';

        addMessageToChat('User', question);

        const loadingId = addLoadingBubble();
        sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        sendBtn.disabled = true;

        try {
            const response = await fetch(`/api/chat?intrebare=${encodeURIComponent(question)}`);
            const text = await response.text();

            document.getElementById(loadingId).remove();
            addMessageToChat('AI', text);
        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessageToChat('AI', 'Eroare de conexiune cu serverul RAG.');
        } finally {
            sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>';
            sendBtn.disabled = false;
        }
    }

    function addMessageToChat(sender, text) {
        const chatBox = document.getElementById('chatBox');
        const isAI = sender === 'AI';

        let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-white">$1</strong>');

        const messageHtml = `
                <div class="flex gap-4 ${isAI ? '' : 'flex-row-reverse'} msg-animate">
                    <div class="w-10 h-10 rounded-full ${isAI ? 'bg-indigo-100 dark:bg-indigo-500/20 border-indigo-200 dark:border-indigo-500/30 text-indigo-600 dark:text-indigo-400' : 'bg-slate-200 dark:bg-slate-700 border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300'} border flex items-center justify-center shrink-0 shadow-sm transition-colors duration-300">
                        <i class="fa-solid ${isAI ? 'fa-robot' : 'fa-user'}"></i>
                    </div>
                    <div class="${isAI ? 'glass bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-700 dark:text-slate-300 rounded-tl-sm' : 'bg-indigo-600 text-white rounded-tr-sm shadow-md'} p-5 rounded-2xl max-w-[80%] leading-relaxed font-light text-[15px] transition-colors duration-300">
                        ${formattedText}
                    </div>
                </div>
            `;
        chatBox.insertAdjacentHTML('beforeend', messageHtml);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addLoadingBubble() {
        const chatBox = document.getElementById('chatBox');
        const id = 'loading-' + Date.now();
        const bubbleHtml = `
                <div id="${id}" class="flex gap-4 msg-animate">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-500/20 border border-indigo-200 dark:border-indigo-500/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0 transition-colors duration-300">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="glass bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 px-6 py-5 rounded-2xl rounded-tl-sm flex items-center transition-colors duration-300">
                        <div class="dots-loader"><div></div><div></div><div></div></div>
                    </div>
                </div>
            `;
        chatBox.insertAdjacentHTML('beforeend', bubbleHtml);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }
</script>
</body>
</html>
