<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular RAG AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-mesh text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

<header class="glass bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 transition-colors duration-300 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
            <i class="fa-solid fa-table-list text-lg"></i>
        </div>
        <div>
            <h1 class="font-bold text-lg leading-none">Tabular RAG</h1>
            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">Platformă Hibridă de Analiză Locală</span>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 select-none">
            <i class="fa-solid fa-user-check text-xs text-emerald-500"></i>
            <span id="usernameDisplay" class="text-sm font-semibold text-slate-700 dark:text-slate-300 px-1">Se încarcă...</span>
        </div>
        <button id="themeToggle" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">

    <section class="md:col-span-1 flex flex-col gap-4">
        <div class="glass bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-5 shadow-sm">
            <h2 class="font-semibold text-sm text-slate-400 uppercase tracking-wider mb-4">Sursă Date</h2>

            <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 rounded-xl p-6 text-center cursor-pointer transition-all bg-slate-50/50 dark:bg-slate-800/10">
                <input type="file" id="csvFile" accept=".csv" class="hidden">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-3"></i>
                <p class="text-sm font-medium mb-1">Încarcă un fișier CSV</p>
                <p class="text-xs text-slate-400">Trage fișierul aici sau dă click</p>
            </div>

            <div id="fileInfo" class="hidden mt-4 p-3 bg-indigo-50/50 dark:bg-indigo-500/5 rounded-xl border border-indigo-100 dark:border-indigo-500/10 flex items-center gap-3">
                <i class="fa-solid fa-file-csv text-2xl text-indigo-500"></i>
                <div class="overflow-hidden-ellipsis">
                    <p id="fileName" class="text-sm font-semibold truncate"></p>
                    <p id="fileStatus" class="text-xs text-slate-400">Se așteaptă indexarea...</p>
                </div>
            </div>
        </div>
    </section>

    <section class="md:col-span-3 flex flex-col h-[calc(100vh-140px)] min-h-[500px] glass bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-2xl overflow-hidden shadow-sm">
        <div id="chatBox" class="flex-1 p-6 overflow-y-auto flex flex-col gap-6">
            <div class="flex gap-4 msg-animate">
                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/10">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="glass bg-slate-100/80 dark:bg-slate-800/40 border border-slate-200/50 dark:border-slate-800/50 px-5 py-4 rounded-2xl rounded-tl-sm max-w-[80%] leading-relaxed font-light text-[15px]">
                    Salut! Încarcă un set de date în format CSV, iar eu te voi ajuta să îl analizezi local folosind o arhitectură hibridă RAG și Text-to-SQL.
                </div>
            </div>
        </div>

        <div class="p-4 bg-slate-50/50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-800 flex gap-3">
            <input type="text" id="userInput" class="flex-1 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:border-indigo-500 dark:focus:border-indigo-400 px-5 py-3.5 rounded-xl focus:outline-none text-sm transition-all shadow-inner" placeholder="Pune o întrebare despre datele tale...">
            <button id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/20 transition-all">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>
    </section>
</main>

<button id="logoutBtn" class="fixed bottom-6 left-6 z-50 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white px-4 py-3 rounded-xl flex items-center gap-2 shadow-lg shadow-rose-600/20 transition-all text-sm font-medium border border-rose-500/10">
    <i class="fa-solid fa-right-from-bracket text-xs"></i>
    <span>Deconectare</span>
</button>

<script src="/js/app.js"></script>
</body>
</html>
